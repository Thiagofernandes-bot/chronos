<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Chronos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">
          <!-- a mesma marca do ícone: a fatia recortada do disco -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12V0a12 12 0 0 1 12 12z" fill="currentColor" />
          </svg>
        </div>
        <div class="brand-txt">
          <strong>Chronos</strong>
          <span>rastreador de tempo</span>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="now" id="now"></div>
    </aside>

    <main class="main">
      <header class="top" id="top">
        <div class="top-l">
          <h1 id="pageTitle">Hoje</h1>
          <p id="pageSub"></p>
        </div>
        <div class="top-r">
          <div class="pills" id="ranges"></div>
          <button class="icon-btn" id="themeBtn" data-act="theme" title="Alternar tema"></button>
        </div>
      </header>
      <div class="scroll" id="view"></div>
    </main>
  </div>

  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
