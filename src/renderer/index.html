<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Chronos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">
          <!-- exatamente o ícone do app: disco verde com a fatia recortada -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#169a50" />
                <stop offset="0.55" stop-color="#55d396" />
                <stop offset="1" stop-color="#35e0c8" />
              </linearGradient>
            </defs>
            <rect width="24" height="24" rx="6.2" fill="#040605" />
            <path d="M12 12 L21.2 12 A9.2 9.2 0 1 1 12 2.8 Z" fill="url(#marca)" />
          </svg>
        </div>
        <div class="brand-txt">
          <strong>Chronos</strong>
          <span>rastreador de tempo</span>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="now" id="now"></div>
    </aside>

    <main class="main">
      <header class="top" id="top">
        <div class="top-l">
          <h1 id="pageTitle">Hoje</h1>
          <p id="pageSub"></p>
        </div>
        <div class="top-r">
          <div class="pills" id="ranges"></div>
          <button class="icon-btn" id="themeBtn" data-act="theme" title="Alternar tema"></button>
        </div>
      </header>
      <div class="scroll" id="view"></div>
    </main>
  </div>

  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
